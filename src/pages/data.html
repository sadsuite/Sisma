<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seismic Insights Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" integrity="sha384-+qdLa7bM8mYd6rTm5LhsC8KK5ZgFJ3hF8C5A4fQ2s5+hKI2zM6q3TgL8+5bvF6fk" crossorigin="anonymous">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../style/data.css">
</head>
<body class="page-data">
    <nav class="navbar">
        <div class="burger-menu" id="burgerMenu">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </div>
        <ul class="nav-links" id="navLinks">
            <li><a href="../index.html">Home</a></li>
            <li><a href="map.html">Map</a></li>
            <li><a href="data.html">Data</a></li>
        </ul>
    </nav>

    <div class="dashboard-container">
        <header>
            <div>
                <h1>Seismic Activity Insights</h1>
                <p>Data visualization of the 12 most recent earthquakes globally.</p>
            </div>
        </header>

        <div id="api-alert" class="card border-danger bg-danger bg-opacity-10 text-danger d-none mb-4">
            <div class="card-body py-3 px-4" id="api-alert-body"></div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Highest Magnitude</div>
                <div class="stat-value" id="max-mag" style="color: var(--accent-danger)">0.0</div>
                <div class="stat-subtext" id="max-mag-loc">—</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Average Magnitude</div>
                <div class="stat-value" id="avg-mag">—</div>
                <div class="stat-subtext">Across past 12 events</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Significant Events (&ge;5.0)</div>
                <div class="stat-value" id="significant-count">0</div>
                <div class="stat-subtext">Require attention</div>
            </div>
        </div>

        <div class="main-content">
            <div class="card">
                <div class="card-title">Magnitude Distribution Timeline</div>
                <div class="chart-container">
                    <canvas id="magnitudeChart"></canvas>
                </div>
            </div>

            <div class="card">
                <div class="card-title">Recent Events Log</div>
                <div id="feed-container" class="feed-list"></div>
            </div>
            <div class="live-badge">
                <div class="live-dot"></div> Live Stream
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="../script.js"></script>
    <script src="../script/data.js"></script>
</body>
</html>
